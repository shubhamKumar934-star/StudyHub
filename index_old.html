function hashSeed(c,s){let n=c*1009;for(const ch of s)n=(n*31+ch.charCodeAt(0))%1000003;return n}
function seeded(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x)}
function shuffle(a,seed=Math.random()*999999){
 const b=[...a];for(let i=b.length-1;i>0;i--){seed=(seed*9301+49297)%233280;const j=Math.floor((seed/233280)*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;
}

function startQuiz(c,s){
 const bank=generateQuestionBank(c,s,220);
 const selected=shuffle(bank).slice(0,20).map(q=>{
   const pairs=q.opts.map((o,i)=>({o,i}));
   const shuffled=shuffle(pairs);
   return {...q,opts:shuffled.map(x=>x.o),a:shuffled.findIndex(x=>x.i===q.a)};
 });
 state.quiz={c,s,questions:selected,index:0,score:0,answered:false,selected:null,started:now(),mode:"20 Questions"};
 setPage("quiz");
}
function quizPage(){
 if(!state.quiz){
  return `${sectionHead("Quiz Arena","A premium practice area with fresh shuffled questions every session.")}
   <div class="card quizShell">
    <div class="grid formGrid">
     <div class="field"><label>Class</label><select id="quizClass" onchange="refreshQuizSubjects()">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===state.class?"selected":""}>Class ${i+1}</option>`).join("")}</select></div>
     <div class="field"><label>Subject</label><select id="quizSubject">${CLASS_SUBJECTS[state.class].map(s=>`<option>${esc(s)}</option>`).join("")}</select></div>
    </div>
    <div class="grid fourCol" style="margin-top:15px">
      <div class="chapterCard"><b>🎲 Randomised</b><p class="muted">Question and option order changes.</p></div>
      <div class="chapterCard"><b>📈 Scored</b><p class="muted">Track accuracy and XP locally.</p></div>
      <div class="chapterCard"><b>💡 Explanations</b><p class="muted">Review the correct answer.</p></div>
      <div class="chapterCard"><b>🏆 Achievements</b><p class="muted">Unlock milestones as you practise.</p></div>
    </div>
    <button class="btn" style="margin-top:16px" onclick="startQuizFromForm()">Start 20 Questions ${ICONS.arrow}</button>
   </div>`;
 }
 const q=state.quiz.questions[state.quiz.index];
 if(!q)return quizResult();
 const total=state.quiz.questions.length,current=state.quiz.index+1;
 return `<div class="quizShell">
   <div class="quizHeader"><div><span class="pill">Class ${state.quiz.c} • ${esc(state.quiz.s)}</span><h2 style="margin:8px 0 0">Quiz Arena</h2></div><div style="text-align:right"><span class="pill">${current}/${total}</span><div class="tiny muted" style="margin-top:5px">Score: ${state.quiz.score}</div></div></div>
   <div class="progress" style="margin:13px 0"><i style="width:${current/total*100}%"></i></div>
   <div class="card"><div class="small muted">${esc(q.tag)} • ${esc(q.difficulty)}</div><div class="quizQuestion">${esc(q.q)}</div>
    <div class="options">${q.opts.map((o,i)=>`<button class="option ${state.quiz.answered?(i===q.a?"correct":i===state.quiz.selected?"wrong":""):state.quiz.selected===i?"selected":""}" onclick="selectQuizAnswer(${i})"><span class="optionLetter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${state.quiz.answered?`<div class="explain"><b>${state.quiz.selected===q.a?"✅ Correct answer!":"❌ Keep practising!"}</b><br><span class="muted">${esc(q.ex)}</span></div>`:""}
    <div class="quizBottom"><button class="btn ghost sm" onclick="quitQuiz()">Exit Quiz</button>${state.quiz.answered?`<button class="btn sm" onclick="nextQuizQuestion()">${current===total?"See Result":"Next Question →"}</button>`:`<span class="tiny muted">Select an option to continue.</span>`}</div>
   </div>
 </div>`;
}
function startQuizFromForm(){const c=Number(document.getElementById("quizClass").value),s=document.getElementById("quizSubject").value;startQuiz(c,s)}
function refreshQuizSubjects(){const c=Number(document.getElementById("quizClass").value),el=document.getElementById("quizSubject");el.innerHTML=CLASS_SUBJECTS[c].map(s=>`<option>${esc(s)}</option>`).join("")}
function selectQuizAnswer(i){
 if(!state.quiz||state.quiz.answered)return;
 state.quiz.selected=i;state.quiz.answered=true;
 if(i===state.quiz.questions[state.quiz.index].a){state.quiz.score++;state.stats.correct++;state.stats.points=(state.stats.points||0)+10}
 state.stats.questions++;
 saveAll();checkAchievements();render();
}
function nextQuizQuestion(){state.quiz.index++;state.quiz.answered=false;state.quiz.selected=null;render()}
function quitQuiz(){if(confirm("Exit this quiz? Your current unfinished quiz will be discarded.")){state.quiz=null;setPage("home")}}
function quizResult(){
 const q=state.quiz,pct=Math.round(q.score/q.questions.length*100);
 if(!q.saved){
  state.stats.quizzes++;state.history.push({title:`Class ${q.c} • ${q.s} Quiz`,score:pct,date:now()});
  state.progress[progressKey(q.c,q.s)]=Math.min(100,Math.max(getProgress(q.c,q.s),pct));
  q.saved=true;saveAll();checkAchievements();
 }
 return `<div class="quizShell"><div class="card" style="text-align:center;padding:28px"><div style="font-size:54px">${pct>=90?"🏆":pct>=70?"🎉":pct>=50?"💪":"🚀"}</div><span class="pill">Quiz Complete</span><h1>${q.score}/${q.questions.length}</h1>
 <div class="resultCircle" style="--score:${pct}%"><span>${pct}%</span></div><p class="muted">Class ${q.c} • ${esc(q.s)} • ${q.mode}</p>
 <div class="grid threeCol" style="margin:18px 0;text-align:left"><div class="chapterCard"><b>Correct</b><div class="statValue">${q.score}</div></div><div class="chapterCard"><b>Accuracy</b><div class="statValue">${pct}%</div></div><div class="chapterCard"><b>XP Earned</b><div class="statValue">${q.score*10}</div></div></div>
 <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"><button class="btn" onclick="startQuiz(${q.c},'${esc(q.s)}')">Try Again</button><button class="btn secondary" onclick="state.quiz=null;openStudy(${q.c},'${esc(q.s)}')">Study Subject</button><button class="btn ghost" onclick="state.quiz=null;setPage('home')">Dashboard</button></div></div></div>`;
}

function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function setTimerMode(mode){

function startTimer(){
 if(state.timer?.running)return;

 if(!state.timer||state.timer.seconds<=0){const m=Math.max(1,Math.min(180,Number(input?.value)||25));state.timer={seconds:m*60,total:m*60,running:true,mode:"Focus"}}
 else state.timer.running=true;
 clearInterval(window.timerInt);window.timerInt=setInterval(()=>{
   if(!state.timer?.running){clearInterval(window.timerInt);return}
   state.timer.seconds--;updateTimerUI();
   if(state.timer.seconds<=0){
     clearInterval(window.timerInt);state.timer.running=false;
     if(state.timer.mode==="Focus"){const mins=Math.round(state.timer.total/60);state.stats.minutes+=mins;state.stats.points=(state.stats.points||0)+mins;saveAll();checkAchievements()}

/* -------------------- CALCULATOR -------------------- */
function calculatorPage(){
 return `${sectionHead("Smart Calculator","Fast calculations with a safe expression parser and local history.","<button class='btn ghost sm' onclick=\"clearCalcHistory()\">Clear History</button>")}
 <div class="card calc"><input id="calcDisplay" class="calcDisplay" value="${esc(state.calc)}" readonly><div class="calcHistory">${state.calcHistory.slice(-5).reverse().map(x=>`<div>${esc(x)}</div>`).join("")}</div>
 <div class="calcKeys">${["C","⌫","%","÷","(",")","7","8","9","×","4","5","6","−","1","2","3","+","0",".","±","="].map(k=>`<button class="${["÷","×","−","+"].includes(k)?"op":k==="="? "equal":""}" onclick="calcKey('${k}')">${k}</button>`).join("")}</div></div>
 <div class="card" style="max-width:480px;margin:16px auto"><h3>Calculator Tips</h3><p class="muted small">Supported operations include +, −, ×, ÷, brackets and percentages. Calculations are processed locally.</p></div>`;
}
function safeCalc(expr){
 let e=expr.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-");
 e=e.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");
 if(!/^[0-9+*\/().\s-]+$/.test(e))throw new Error("Invalid expression");
 if(!e.trim())return "";
 /* No eval/Function: small arithmetic parser. */
 const tokens=e.match(/(?:\d+(?:\.\d+)?|[()+\-*/])/g)||[];
 let pos=0;
 function parseExpr(){let v=parseTerm();while(tokens[pos]==="+"||tokens[pos]==="-"){const op=tokens[pos++],r=parseTerm();v=op==="+"?v+r:v-r}return v}
 function parseTerm(){let v=parseFactor();while(tokens[pos]==="*"||tokens[pos]==="/"){const op=tokens[pos++],r=parseFactor();if(op==="/"&&r===0)throw new Error("Divide by zero");v=op==="*" ? v*r : v/r}return v}
 function parseFactor(){if(tokens[pos]==="-"){pos++;return -parseFactor()}if(tokens[pos]==="+"){pos++;return parseFactor()}if(tokens[pos]==="("){pos++;const v=parseExpr();if(tokens[pos]!==")")throw new Error("Bracket error");pos++;return v}const t=tokens[pos++];if(!t||!/^\d/.test(t))throw new Error("Expression error");return Number(t)}
 const val=parseExpr();if(pos!==tokens.length||!Number.isFinite(val))throw new Error("Expression error");return Number.isInteger(val)?String(val):String(Number(val.toFixed(10)));
}
function calcKey(k){
 if(k==="C"){state.calc="";render();return}
 if(k==="⌫"){state.calc=state.calc.slice(0,-1);render();return}
 if(k==="±"){state.calc=state.calc.startsWith("-")?state.calc.slice(1):"-"+state.calc;render();return}
 if(k==="="){
  try{const result=safeCalc(state.calc);if(result!==""){state.calcHistory.push(`${state.calc} = ${result}`);state.calc=result;saveAll()}}
  catch(e){state.calc="Error"}
  render();return
 }
 state.calc+=k;render();
}
function clearCalcHistory(){state.calcHistory=[];saveAll();render();notify("Calculator history cleared")}

 <div class="card"><h3>Study Consistency</h3>${miniChart([8,15,22,18,28,20,34].map(v=>Math.min(100,v+state.stats.minutes%20)))}<p class="muted tiny">Illustrative local activity visualization based on stored study progress.</p></div></div>

function globalSearch(v){
 state.search=v;const box=document.getElementById("searchResults");if(!box)return;
 if(!v.trim()){box.classList.add("hidden");return}
 const q=v.toLowerCase(),hits=[];
 for(let c=1;c<=12;c++)for(const s of CLASS_SUBJECTS[c]){
   if((`class ${c} ${s}`).toLowerCase().includes(q))hits.push({type:"Class",label:`Class ${c} • ${s}`,action:`openStudy(${c},'${esc(s)}')`});
   for(const ch of (CHAPTERS[s]||[]))if(`${s} ${ch} class ${c}`.toLowerCase().includes(q))hits.push({type:"Chapter",label:`Class ${c} • ${s} • ${ch}`,action:`openStudy(${c},'${esc(s)}');state.chapter=${(CHAPTERS[s]||[]).indexOf(ch)};render()`});
 }
 const pages=[["Dashboard","home"],["My Classes","classes"],["Quiz Arena","quiz"],["My Notes","notes"],["Flashcards","flashcards"],["Study Planner","planner"],["Focus Timer","timer"],["Calculator","calculator"],["Analytics","analytics"],["Achievements","achievements"],["Leaderboard","leaderboard"],["Daily Knowledge","knowledge"],["Settings","settings"],["Help Center","help"]];
 pages.forEach(p=>{if(p[0].toLowerCase().includes(q))hits.push({type:"Tool",label:p[0],action:`setPage('${p[1]}')`})});
 box.innerHTML=hits.slice(0,25).map(h=>`<button class="searchResult" onclick="${h.action};document.getElementById('searchResults').classList.add('hidden')"><span class="pill">${h.type}</span><span>${esc(h.label)}</span></button>`).join("")||`<div class="empty" style="padding:25px">No matching results.</div>`;

}

  ["🏠","Go to Dashboard",()=>setPage("home")],["🎓","Open My Classes",()=>setPage("classes")],["🧠","Start Quiz Arena",()=>setPage("quiz")],
  ["📝","Open My Notes",()=>setPage("notes")],["⏱","Open Focus Timer",()=>setPage("timer")],["🧮","Open Calculator",()=>setPage("calculator")],
  ["🗂","Open Flashcards",()=>setPage("flashcards")],["🗓","Open Study Planner",()=>setPage("planner")],["📊","Open Analytics",()=>setPage("analytics")],
